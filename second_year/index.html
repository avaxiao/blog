y0luO4aMhtkLL8Bi3bUWYvzh5Mn1dTxrL6QmGuRhGL/TiTTxRoEdTszSaq9GR0NGA3KdkOz3hqSV3MIDhQ5IVX/Ivx3umBti2es2h4eZby7x8br1rkf7Mo90AqC8aQ3sJeNzqFRu+vSANAQe3PL7l0HGOAdwDCeZYvNKeoZp1Qfs6Aipndh86HmFRi0LAnEO47wsqM6cdfjh3jBPUzhZy7nvlUfFsamED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">博二小结<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>时间一晃来到了博二，依旧是没有paper的一年。虽然很多人都和我说paper不能证明什么，但没有paper，一定说明哪里出了问题，更别说我的研究方向是CV了。痛苦自责的情绪在暑期实习之后到达顶峰，开始质疑自己各方面的能力，觉得自己辜负了Derek也辜负了暑期实习的mentor，他们给了我绝对的研究自由，我却什么也没搞出来。我开始害怕和人交流，不想见人不想说话，觉得自己就是个完完全全的失败者。</p> <p>颓废抑郁了大半个月之后，终于在一次weekly meeting和Derek诉说了一下我的痛苦，我害怕他对我失望，我害怕变成一个浑浑噩噩的人，我不懂为什么他总是能包容学生从不push。Derek的回答真的是完全出乎我的意料，他说他相信每个人的初衷都是好的，大家都在尽自己的全部努力去把事情做好。research本来就是很难的一件事，学生是在学习，只要有往上走的意愿，那么慢一点也没关系的。另外不要自责，他身为advisor，如果他觉得我哪里不对，他会想办法帮我回归正轨的。</p> <p>该怎么描述听完这段话的感觉，像是挂在悬崖边的人，松手之后发现原来所谓的悬崖原来只有几厘米高，像是拿到绝症通知书的第二天被告知是误诊。困扰我一年多的“害怕”，没想到一刹那就烟消云散。总之感觉自己很幸运，遇到了这么好的老板，Derek真的是天使。</p> <p>那天meeting之后，我终于没有再被过去的失败困扰。我相信我是在前进的，即便步调缓慢，总有一天我能成为一个independent researcher。我知道现在的我，很多能力都不足，比如没有insight，不够积极主动，英语也不好。但我相信这些都是能够解决的，我会一点一点去提升这些能力。只要今天的我比昨天的我更好一些，那我就没有虚度。</p> <p>说来有趣，当我没有了对paper的得失心，终于能够以一颗平常心去看待research之后，项目反而开始有了一些起色。今日未济，明日可期。让我们看看明年的总结我会写些什么吧。</p></div></div> <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.css" integrity="sha384-AfEj0r4/OFrOo5t7NnNe46zW/tFgW6x/bCJG8FqQCEo3+Aro6EYUG4+cU+KJWu/X" crossorigin="anonymous"> <script defer="defer" src="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.js" integrity="sha384-g7c+Jr9ZivxKLnZTDUhnkOnsh30B4H0rpLUpJ4jAIKs4fnJI+sEnkvrMWph2EDg4" crossorigin="anonymous"></script> <script defer="defer" src="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/contrib/auto-render.min.js" integrity="sha384-mll67QQFJfxn0IYznZYonOWZ644AWYC+Pt2cHqMaRhXVrursRwvLnLaebdGIlYNa" crossorigin="anonymous"></script> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/blog/tags/?tag=reflection" title="标签">#reflection</a></div> <div class="last-updated"><span class="prefix">Update Time:</span> <span class="time">2026/07/05, 16:16:01</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/blog/2022_Fall_CS_PhD_application/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">2022 Fall CS PhD申请总结</div></a> <a href="/blog/third_year/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">博三小结</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
