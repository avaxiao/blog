Gv44wNpC90aASqGfVlz/Rx17srQ57/UU26hkhQqUB7dBR71WmzQhHUnblGmVOEw0jhbV1n9OlXUDCIRGaNV5Jp43N516fN7JmnTHdfp7Hgy0luO4aMhtkLL8Bi3bUWYvzh5Mn1dTxrL6QmGuRhGL/TiTTxRoEdTszSaq9GR0NGA3KdkOz3hqSV3MIDhQ5IVX/Ivx3umBti2es2h4eZby7x8br1rkf7Mo90AqC8aQ3sJeNzqFRu+vSANAQe3PL7l0HGOAdwDCeZYvNKeoZp1Qfs6Aipndh86HmFRi0LAnEO47wsqM6cdfjh3jBPUzhZy7nvlUfFsamED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">2022 Fall CS PhD申请总结<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="碎碎念"><a href="#碎碎念" class="header-anchor">#</a> 碎碎念</h2> <p>选择读博算是人生中数一数二的重大决定了，这条路很难，尤其是现在CV领域竞争白热化，很多次想过放弃，但万幸遇到了很多良师益友，最终一步步走了过来。在此做个记录，希望能给之后打算申请PhD的同学一些帮助。</p> <h2 id="相关经验帖"><a href="#相关经验帖" class="header-anchor">#</a> 相关经验帖</h2> <p>我在申请之初是个纯小白，问了一圈学姐学长的经验与建议，并且看了一些经验帖之后，才算是知道了大致流程。以下是一些对我帮助很大的帖子：</p> <ul><li>吴紫屹，<a href="https://zhuanlan.zhihu.com/p/350439006" target="_blank" rel="noopener noreferrer">2021 Fall 申请回忆录<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，这位同学的介绍十分详尽，同时把他申请时候的各种材料都上传到GitHub了，非常具备参考价值。</li> <li>翁家翌，<a href="https://trinkle23897.github.io/posts/application" target="_blank" rel="noopener noreferrer">申请回忆录<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，系统性地介绍了申请中的需要准备的材料，其中关于文书撰写的注意事项我觉得总结的非常好。</li> <li><a href="https://mp.weixin.qq.com/s/5MCN4neLT34JR3kruq0xcA" target="_blank" rel="noopener noreferrer">一个普通学生的PhD申请之路<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，这篇麻雀虽小，五脏俱全，相较于前两篇的大而全，这篇比较精炼，能够迅速了解到申请的全貌。</li></ul> <p>知乎上面也有很多的经验介绍，当然学姐学长也是一个重要的信息来源，尤其是相同研究方向的学姐学长，他们会对业内的研究动向更为敏锐，比如某某老师跳槽去了哪哪儿，哪个学校最近招了大量AP。总之多和不同的人聊聊，总是有益无害的。</p> <h2 id="准备"><a href="#准备" class="header-anchor">#</a> 准备</h2> <p>这一部分主要讨论是否真的准备好了读博，以及是否需要找中介。</p> <h3 id="信念"><a href="#信念" class="header-anchor">#</a> 信念</h3> <p>读博是一个长达五年的承诺，这期间会遇到各种挫折，我认识的很多PhD或多或少都质疑，甚至后悔过选择这条路。我也认识有的PhD直接和老板闹掰了，只能quit收场。读博绝对不是一条轻松的路，如果看过《魔法少女小圆》的话，可以看看这个帖子冷静一下：<a href="https://movie.douban.com/review/6180006/" target="_blank" rel="noopener noreferrer">魔法少女小圆其实讲的是PhD的故事<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>。</p> <p>其实每个人决定读博之前，都得被劝退一波才行。知乎上有很多劝退故事，我在此就不赘述读博的艰辛了。在我看来，决定读博的理由只能有一个，那就是热爱。想要做一些有意思的事情，喜欢做research，享受一点一滴扩宽人类知识边际的过程，即便这个过程极有可能碰壁。读博相当于允诺了未来五年都有可能007，别人聚会玩耍的时候你在跑实验，别人看剧打游戏的时候你在读paper。没有强制的上下班时间，也就意味着休息时间和工作时间之间界限的绝对模糊。</p> <p>读博意味着什么，为什么读博，这两个问题一定要想清楚。只有在申请之前想清楚了这两个问题，之后读博途中遇到各种挫折，才不至于没有心理准备。</p> <h3 id="中介"><a href="#中介" class="header-anchor">#</a> 中介</h3> <p>我问过很多学姐学长，他们申请PhD时是否有找中介，绝大多数的回答是否定的。申请说难也难，要进实验室努力发paper，在professor面前刷脸要推荐信，还要准备文书CV，选校选老师，陶瓷面试。但这些本质上都只能靠自己。中介能帮上忙的地方，也就润色文书，掐点timeline，填网申而已。如果能找到靠谱的中介，对文书提出逻辑指导，而不只是词藻替代，那还是可以的。但怎么说呢，中介对于文书的认识不一定有学姐学长认识深刻。我申请是完全diy的，但我的所有申请材料，都找我认识的PhD学姐学长们过了好几遍。自己一点一点打磨，多多看一些模版文书也有助于提升自己的写作能力。</p> <h2 id="申请"><a href="#申请" class="header-anchor">#</a> 申请</h2> <p>我只申请了北美，大多数学校的申请材料只需要SOP、CV、以及三封推荐信，小部分学校还要了PS。至于托福GRE，有些学校对口语有硬性要求，就算是美本也不能waive，比如UIUC。所以语言成绩这一块儿一定要提前check清楚。如果要申请香港，欧洲的话，那还需要准备 research proposal。</p> <h3 id="时间线"><a href="#时间线" class="header-anchor">#</a> 时间线</h3> <p>关于申请的大致时间线，以下这个table是我觉得比较合适的。</p> <table><thead><tr><th>行动</th> <th>时间</th></tr></thead> <tbody><tr><td>进实验室</td> <td>越早越好，因为这涉及到推荐信以及publications的的质量</td></tr> <tr><td>准备托福GRE</td> <td>理论上十一月考出来就行，但是考虑到十一月申请会非常忙碌，还是建议暑假就考出来</td></tr> <tr><td>选校陶瓷</td> <td>暑假就可以开始陶瓷了，最好能在申请之前问一遍意向老师是否招人</td></tr> <tr><td>CV</td> <td>个人经历汇总，不难弄，可以找个好看的模版，花个一两天做一下，细节可以再慢慢打磨</td></tr> <tr><td>SOP</td> <td>虽然只需要两页，但是想写好很难，需要反复迭代，建议九月开始写</td></tr> <tr><td>要推荐信</td> <td>有些老师每年只给有限个学生写推荐信，十月就可以问老师能否帮忙写推荐信了</td></tr> <tr><td>填网申</td> <td>北美绝大多数学校12.15网申截止，估摸好时间并且提前看好各个学校的申请要求</td></tr> <tr><td>个人网站</td> <td>optional，但大多数 CS PhD 都会有，可以比CV展示更多信息并且实时更新，建议做一个</td></tr> <tr><td>准备面试</td> <td>申请之后就开始面试了，做slides介绍自己的research，可以找同学多帮忙排练几遍</td></tr></tbody></table> <h3 id="进实验室"><a href="#进实验室" class="header-anchor">#</a> 进实验室</h3> <p>如果是已经在海外读本科或者硕士，那么一定要抓紧一切机会进实验室。提早进入实验室，可以有更多的时间做research，有助于发现自己真正感兴趣的研究方向。很多时候，看看推荐信和publications就能决定一个学生可以去哪儿了。对于申博来说，课程可能占比不大。如果精力实在分配不过来，可以战略性放弃课程（这里的战略性放弃是指可以选一些水课，而不是说绩点多垃圾都无所谓。对于两个其他材料差不多的学生，professor大概率还是会选绩点更高的那个吧）。</p> <p>另外暑研也是很重要的一个经历。暑研可以申请其他学校的lab，三月可以开始陶瓷暑研了。很多大牛老师都喜欢录取已经合作过的学生，那么如果能争取到他们实验室的研究机会，指不定就直接拿了return offer呢～</p> <h3 id="选校陶瓷"><a href="#选校陶瓷" class="header-anchor">#</a> 选校陶瓷</h3> <p>想知道各个学校CS的排名的话，可以看看 <a href="https://jeffhuang.com/computer-science-open-data/" target="_blank" rel="noopener noreferrer">Computer Science Open Data<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，该排名综合考虑了毕业生成为faculty的比例，best paper数目，以及薪资这几个phd比较关心的因素。而<a href="http://csrankings.org/" target="_blank" rel="noopener noreferrer">csrankings<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>则是统计paper发表数目的一个排名。虽说csrankings比较滞后，很多新招的AP老师都没录入；或者有些老师几年前就跳槽去了另一个学校，这个网站却依旧没更新这个跳槽信息，但总的来说还是可以通过csrankings，对各个学校的CS强弱有一个大致的了解。和csrankings类似的排名网站还有<a href="https://airankings.org/" target="_blank" rel="noopener noreferrer">airankings<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>。</p> <p>各个学校的招生制度都不太相同，比如四大就是强committee制度，对于强committee的学校，学校会组织老师或者在读PhD学生筛选候选人，这种时候就不是professor自身能决定是否录取了。对于committee和professor混合制的学校，一般是需要先过了committee这一关，professor再从candidate pool里面捞人。而强professor制，就单纯只需要教授拍板了，申请材料，甚至申请ddl都不重要了。</p> <p>强professor的学校有：USC，Caltech，UCLA，RPI，Gatech，JHU，CU Boulder，NEU，UCSB, UCD, UCI，UCSC，UMassAmherst，CMU ECE，UIUC ECE + CS，UVA，Rutgers，PSU，UTD，UCF，NYU，UMN，Syracuse，GWU，CWRU，UNC，UMich，Brandeis。</p> <p>要了解各个老师的具体研究项目，就只能去他们的个人网站看了。不过个人网站也会有滞后问题，很多老师的最新研究项目并不会放到网站上，这种时候就只能靠多问了。如果你发现一个老师大方向一致，都是CV，但是小方向差的有点多，这种情况也不防试一试。发一封email陶瓷一下没有任何坏处。</p> <p>陶瓷信的撰写很有讲究，毕竟一个老师一天可能会收到几十上百封陶瓷信。如何在短短两三百字内，抓住老师的眼球，并引起他回复的兴趣，很考验人。我的做法是，把自己最亮眼的成果，总结一下放在第一段，引起老师的兴趣之后，再详细陈述我的经历。</p> <p>这里直接引用某位老师对于陶瓷信的要求：</p> <p>In your email, please include the following items</p> <ul><li>Title as “Prospective PhD Student: YourName - YourAffliation”</li> <li>Briefly introduce yourself, including education background, research experiences, and programming skills.</li> <li>Briefly explain your motivations and expectations of working with me Include a PDF version of your CV.</li> <li>Briefly introduce what research problem that you are interested in. What are the current state-of-the-art solutions and why do you think you can further improve over them?</li></ul> <p>有一些网站会汇总老师的招生信息，比如<a href="http://www.andrewkuz.net/cs-hci-research-hub/" target="_blank" rel="noopener noreferrer">CS/HCI Research Hub<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，发起人是CMU的一个PhD，这个网页汇总了twitter上老师们的招生信息，包括PhD招生及暑研机会；<a href="https://www.1point3acres.com/bbs/forum.php?mod=forumdisplay&amp;fid=173&amp;filter=lastpost&amp;orderby=lastpost&amp;typeid=583" target="_blank" rel="noopener noreferrer">一亩三分地招生版块<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>值得多刷刷，很多AP老师会上去发帖。</p> <p>还有一些公众号也会每天推送招生信息，比如 AI求职、北美PhDLeague、微offer。</p> <h3 id="cv-sop"><a href="#cv-sop" class="header-anchor">#</a> CV / SOP</h3> <p>简历找个latex模版，用latex的原因是，word很容易把格式弄的杂乱，latex一般来说比较干净整洁。简历中不要有年龄和照片，突出自己的强项就行，paper多的话就列一个很长的list，得过奖的话就放在最显眼的位置。</p> <p>SOP我自己的感觉是越清晰越concrete越好，基本上就是 （非常concrete的）我想做什么research，然后下面很有逻辑很具体的讲明白为啥想做这个research，自己之前的background为什么可以让自己well-equipped做这个research。不要搞花哨了，就结构和逻辑特别特别清楚是最好的。</p> <p>研究兴趣也是，具体清楚。你要写my research interests are AI, machine learning啥啥啥 就不是很好；写具体精确：use xxx, yyy, zzz perspective to solve aaa problem in bbb。如果写具体了，却没一个教授感兴趣的话，只能说这个学校不适合，跟能力无关。如果可以的话，找找目标领域的faculty candidate的research statement, 然后参考这个来写。</p> <p><a href="https://cs-sop.org" target="_blank" rel="noopener noreferrer">https://cs-sop.org<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>收集了一些往届CS PhD的SOP。</p> <p>润色的话，我是靠学姐学长改逻辑，然后去学校的文书中心改语法。也有同学推荐 <a href="https://www.fiverr.com/" target="_blank" rel="noopener noreferrer">fiverr<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，我没试过，看网上评价还不错。</p> <h2 id="面试"><a href="#面试" class="header-anchor">#</a> 面试</h2> <p>有一些学校由于完全是committee制，不组织面试直接发放offer，但大多数还是要面试的，面试时间集中在十二月末到二月中。我刚开始面试的时候特别紧张，很怕老师问了什么问题但是我回答不出来。但后来发现老师来面试绝不是想要刁难学生，他们可能只是想来聊聊天，了解一下学生的research interest，互相认识一下。所以心态放轻松就行，不用想着讨好老师什么的，这是一个相互选择的过程，老师考察学生的同时，学生其实也需要考虑老师的lab是否适合自己。有些学生会希望和导师多多meeting，以此push自己加快进度，那么他们可能会更喜欢跟着AP老师；还有一些学生喜欢自己完全主导project，那么他们会喜欢不那么push的大牛老师。想清楚自己的需求，也方便在面试的最后，向导师提问的环节，问一些自己比较关心的因素。</p> <p>我面试期中遇到过比较有意思的问题有：</p> <ul><li>你关注的研究领域中，有哪些work用了和你们类似的方法？你们和他们的异同是什么？</li> <li>说一个你失败的项目，并且描述为什么失败了，如果重来你会怎么做。</li> <li>发了两篇paper，让我看了之后总结contributions，并且思考一下我可以做什么后续工作。</li> <li>考察了一个data mining中的知识点，让我陈述这个方法的缺陷，以及让我现场提出一个改进方法。</li></ul> <p>总的来说，面试的氛围都很轻松，老师们也都很和蔼可亲。听老师们描述他们的project，一起讨论也很有意思。如果真遇到了不会的问题，直接说不清楚就行，老师们也会谅解的。</p> <p>最后的向老师提问环节别浪费，可以问一问录取相关的问题，也可以问一问lab氛围啥的。<a href="https://drive.google.com/file/d/1o2ZTrUQYDXKbMlcmSH8lE-MW5vOX77PR/view" target="_blank" rel="noopener noreferrer">The Definitive ‘what do I ask/look for’ in a PhD Advisor Guide<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>提供了一些问题样例。</p> <h2 id="等待结果"><a href="#等待结果" class="header-anchor">#</a> 等待结果</h2> <p>等待是很磨人的，但是至此已经没什么别的能做的了。最早的结果，可能一月中就放出来了，大多数学校还是在二月放结果。一般三月末所有的结果都能出来，毕竟学生们需要在4.15之前决定接哪家offer。<a href="https://www.thegradcafe.com/survey/?per_page=20&amp;q=&amp;institution=&amp;program=Computer+Science&amp;degree=PhD" target="_blank" rel="noopener noreferrer">GradCafe<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>，<a href="https://www.1point3acres.com/bbs/forum.php?mod=forumdisplay&amp;fid=82&amp;filter=sortid&amp;sortid=164&amp;orderby=dateline" target="_blank" rel="noopener noreferrer">一亩三分地录取板块<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>都会有同学分享录取结果，可以在上面看看各个学校是否开始发offer了。</p> <p>拿到offer之后，就要做决定去哪个lab了。<a href="https://blog.ml.cmu.edu/2020/03/02/questions-to-ask-a-prospective-ph-d-advisor-on-visit-day-with-thorough-and-forthright-explanations/" target="_blank" rel="noopener noreferrer">Questions to Ask a Prospective Ph.D. Advisor on Visit Day<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>详细介绍了一些需要在接offer之前了解的问题。可以和老师们约个时间聊一聊，了解清楚各个lab的情况，再结合自身做出最终决定。</p> <p>下列是一些我关心的问题：</p> <ol><li>lab氛围怎么样</li> <li>和老板的合作模式是怎样，会不会push人，是不是很强硬，写了paper能和老板一起讨论修改吗</li> <li>毕业要求</li> <li>可以转学分吗</li> <li>老板funding够不够，需要做ta/ra嘛</li> <li>生活条件</li> <li>组里同学的去向</li> <li>暑假能不能出去实习，对实习有限制吗（课题限制，或者是实习类型限制）</li> <li>你做的项目，是老板直接分配的，还是自己随便立</li> <li>老板有没有跳槽打算，或者去工业界</li></ol></div></div> <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.css" integrity="sha384-AfEj0r4/OFrOo5t7NnNe46zW/tFgW6x/bCJG8FqQCEo3+Aro6EYUG4+cU+KJWu/X" crossorigin="anonymous"> <script defer="defer" src="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.js" integrity="sha384-g7c+Jr9ZivxKLnZTDUhnkOnsh30B4H0rpLUpJ4jAIKs4fnJI+sEnkvrMWph2EDg4" crossorigin="anonymous"></script> <script defer="defer" src="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/contrib/auto-render.min.js" integrity="sha384-mll67QQFJfxn0IYznZYonOWZ644AWYC+Pt2cHqMaRhXVrursRwvLnLaebdGIlYNa" crossorigin="anonymous"></script> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/blog/tags/?tag=resource" title="标签">#resource</a></div> <div class="last-updated"><span class="prefix">Update Time:</span> <span class="time">2026/08/06, 12:52:22</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><!----> <a href="/blog/second_year/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">博二小结</div></a></div> <div class="page-nav"><p class="inner"><!----> <span class="next"><a href="/blog/second_year/">博二小结</a>→
