      </script> <div class="articleInfo-wrap" data-v-70c4306a><div class="articleInfo" data-v-70c4306a><ul class="breadcrumbs" data-v-70c4306a><li data-v-70c4306a><a href="/blog/" title="Index" class="iconfont icon-home router-link-active" data-v-70c4306a></a></li> <li data-v-70c4306a><a href="/blog/categories/?category=blog" title="Categories" data-v-70c4306a>blog</a></li><li data-v-70c4306a><a href="/blog/categories/?category=Learning%20Guides" title="Categories" data-v-70c4306a>Learning Guides</a></li></ul> <div class="info" data-v-70c4306a><div title="author" class="author iconfont icon-touxiang" data-v-70c4306a><a href="https://avaxiao.github.io/" target="_blank" title="author" class="beLink" data-v-70c4306a>Ava</a></div> <div title="create time" class="date iconfont icon-riqi" data-v-70c4306a><a href="javascript:;" data-v-70c4306a>2022-07-12</a></div> <!----></div></div></div> <!----> <div class="content-wrapper"><div class="right-menu-wrapper"><div class="right-menu-margin"><div class="right-menu-content"></div></div></div> <h1><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeCAYAAAA7MK6iAAAAAXNSR0IArs4c6QAABGpJREFUSA3tVVtoXFUU3fvOI53UlmCaKIFmwEhsE7QK0ipFEdHEKpXaZGrp15SINsXUWvBDpBgQRKi0+KKoFeJHfZA+ED9KKoIU2gYD9UejTW4rVIzm0VSTziPzuNu1z507dibTTjL4U/DAzLn3nL3X2o91ziX6f9wMFdh6Jvbm9nNSV0msViVO6tN1Rm7NMu2OpeJ9lWBUTDxrJbYTS0hInuwciu9eLHlFxCLCZEk3MegsJmZ5K/JD6t7FkFdEvGUo1g7qJoG3MHImqRIn8/nzY1K9UPKKiJmtnUqHVE3Gbuay6vJE/N2FEmuxFjW2nUuE0yQXRRxLiTUAzs36zhZvOXJPdX850EVnnLZkB8prodQoM5JGj7Xk2mvC7JB8tG04Ef5PiXtG0UtxupRQSfTnBoCy554x18yJHI6I+G5Eru4LHmPJZEQsrvPUbMiA8G/WgMK7w7I+ez7++o2ANfbrjvaOl1tFMs+htG3IrZH9/hDX1Pr8Tc0UvH8tcX29KzAgIGcEkINyW5BF9x891hw6VYqgJHEk0huccS7vh3C6gTiODL+26huuBtbct8eZnqLML8PkxGYpuPZBqtqwkSjgc4mB5gbgig5i+y0UDK35LMxXisn9xQtK+nd26gTIHsHe/oblK/b29fUmN/8Y+9jAQrnBp56m1LcDlDp9irKTExSKduXJVWSqdBMA08pEJnEIOB3FPPMybu/oeV8zFeYN3xx576Q6RH+VmplE4ncQV5v+5rzSoyOU7PuEAg8g803PwBJ0CExno/jcMbN8tONYeOmHiuUNryvm3fRUy4tMPVLdAGkUhNWuggGrJcXPv+ouCjz0MKUHz1J2/E8IC9nqTabcxgaBYM0hPhD5Y65FsbxRQKxCQrDjDctW7PUM3HuZunFyifSAqEfuzCp48Il24luWUWZoyJCaPR82jE0+kFA643wRFVni4RYSq3ohJO2pZ7B5dO4xkDWbEpossJPLSrPjYID8rS2UHTlvyNxqIGsg674XJJ7vnh5L7PNwC4hh2sjCI96mzszOTpxLF0T7l88Yz7lAuK6OnL8gXLOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">PhD Guideline<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>Below are stolen from Prof. <a href="https://dhoiem.cs.illinois.edu" target="_blank" rel="noopener noreferrer">Derek Hoiem<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a></p> <h2 id="goals-of-a-phd"><a href="#goals-of-a-phd" class="header-anchor">#</a> Goals of a PhD</h2> <p>Most students begin the PhD with very little advanced research experience but with some project experience and possibly involvement in a research lab.  During the PhD, a student in computer vision must become familiar with a broad range of techniques and maths.  The student should also have a very good understanding of the background of 2-3 areas and contribute towards 1-3 areas in the dissertation and other published works.  Progressing towards the PhD requires developing in several areas:</p> <h3 id="formal-thinking"><a href="#formal-thinking" class="header-anchor">#</a> Formal Thinking:</h3> <p>Rather than approaching problems heuristically or through trial and error, the student should develop the ability to formalize a problem mathematically and formalize solutions.  In many areas of computer vision, this requires being fluent with linear algebra, calculus, and statistics and being able to translate high-level and partially empirical problems into formal language.  This ability is developed through coursework, careful reading of papers, and eventually through practice in research.</p> <h3 id="knowledge"><a href="#knowledge" class="header-anchor">#</a> Knowledge:</h3> <p>Understanding what has been done is crucial to pose original problems and solutions.  As Jitendra says, “A year in the lab can save a day in the library.”  Hundreds of papers are published in computer vision every year, so it takes quite a while to get a handle on it.  It is tempting to start with the most recent papers that achieve the best results, but these papers often build heavily on earlier foundational works.  Your advisor can help identify the foundational works and may be able to suggest a reading list of other papers that introduce key ideas.</p> <h3 id="experimentation"><a href="#experimentation" class="header-anchor">#</a> Experimentation:</h3> <p>The goal of an experiment is to test a hypothesis, not to demonstrate good performance.  Many times we are hoping to demonstrate that a proposed change will lead to better performance, but it is important to remember that unless we have a good idea why a change should lead to improvement, the experiment has little value regardless of the outcome.  Being able to specifically predict an outcome enables better debugging and design of more specific experiments.  Learning to experiment involves learning: (1) to identify key questions to answer; (2) to design experiments that best answer those questions; (3) to predict outcomes of experiments; (4) to carefully examine data and results for signs of errors or unexpected outcomes.</p> <h3 id="proposing-research-problems"><a href="#proposing-research-problems" class="header-anchor">#</a> Proposing Research Problems:</h3> <p>Eventually, a student should be able to identify new ways to improve representations or techniques, or new applications.  To get to this stage requires good background knowledge and formal thinking skills.</p> <h3 id="evaluating-proposed-research"><a href="#evaluating-proposed-research" class="header-anchor">#</a> Evaluating Proposed Research:</h3> <p>Research is slow, so one of the key abilities of a researcher is to differentiate between fruitful research direction and unfruitful ones.   This requires anticipating impact and interest in an idea, identifying possible pitfalls, and evaluating feasibility.  In other words, will anyone care, and can it be done?</p> <h3 id="communication"><a href="#communication" class="header-anchor">#</a> Communication:</h3> <p>Impact directly comes from papers, talks, and code.   Thus, being able to explain ideas clearly and concisely is important.   With experience, you will become better at anticipating the readers’ reactions to a paper, which will help to write more compelling motivations, clearer technical sections, and more complete experimental results.</p> <h3 id="visibility"><a href="#visibility" class="header-anchor">#</a> Visibility:</h3> <p>You can build visibility by creating a website, giving talks and posters in conferences and workshops, by talking to visitors and other students and researchers at conferences, by completing internships, and visiting other institutions.  The importance of visibility and networking depends on whether you aim for an academic career or industrial research and engineering.</p> <h2 id="expectations"><a href="#expectations" class="header-anchor">#</a> Expectations</h2> <h3 id="year-1"><a href="#year-1" class="header-anchor">#</a> Year 1:</h3> <p>Focus on acquiring background and basic research skills.   Obtain broad familiarity of computer vision, machine learning, and related areas.  Acquire more detailed expertise of related work in 1-2 areas.  Perform a research project, which could be a simple non-publishable work such as trying to improve features or classifiers for a prediction problem.  Try to get an internship that will further develop technical and research skills and help begin networking.  Attend a conference.  Give a talk to the local vision group (e.g., in a reading group).  Aim to read about 100 papers in class and on your own.</p> <h3 id="year-2"><a href="#year-2" class="header-anchor">#</a> Year 2:</h3> <p>Focus on improving research skills and proposing project ideas. Work on a project extending an existing work, perhaps something done by another current or former member of the vision group.  Also start thinking about possible research directions for your main line of research.  Submit a paper (perhaps based on internship or previous year, or based on research in fall semester).   Read 2-3 papers carefully every week on your own, in addition to papers discussed in reading groups and classes.</p> <h3 id="year-3"><a href="#year-3" class="header-anchor">#</a> Year 3:</h3> <p>Focus on finding a major research direction and improving independence. Find thesis direction.  Propose general areas of interest and possible specific research problems.  Work with advisor to find most promising directions and specific solutions.  At this point, student and advisor should both contribute substantially to the direction of research, but the student should be capable of formulating the technical approach and designing experiments.  By the end of the third year, 1-2 papers should be published at a major conference.  Classes should almost or fully finished by the end of this year.  The student should be comfortable giving talks and writing.   Continue reading 2-3 papers per week in detail and several others more superficially.</p> <h3 id="year-4"><a href="#year-4" class="header-anchor">#</a> Year 4:</h3> <p>Further improve independence and work on visibility. If all is going well, this year is devoted to developing along thesis directions, building on work done in year 3, with faster progress due to lack of course load.  The student should be able to propose good research directions, perhaps with some guidance from the advisor.  The student should start giving talks to outside groups, either in local workshops or visits.</p> <h3 id="year-5"><a href="#year-5" class="header-anchor">#</a> Year 5:</h3> <p>Complete thesis and get a job.  Try to complete a research project with almost complete independence.  At this point, use advisor more as a sounding board than a director.  In the next year, you may be leading your own research team, so this is a chance to test independence while still having support if needed.</p> <h2 id="graduate-student-milestones"><a href="#graduate-student-milestones" class="header-anchor">#</a> Graduate Student Milestones</h2> <h3 id="publications"><a href="#publications" class="header-anchor">#</a> Publications:</h3> <p>You might publish a second-author paper by the end of the first or second year.  You are doing well if you publish a first-author paper by the end of the second year.  You are behind if you do not publish a first-author paper by the end of the third year and are seriously behind if you do not have a good submission by that time.  By the time you graduate, you should have at least three publications along a consistent theme in which you are the main contributor.  Typically, by graduation, a student will have 4-5 publications from a mixture of internships and work with the advisor.  It is also good to submit journal papers in the fourth and fifth years.</p> <h3 id="research-skills"><a href="#research-skills" class="header-anchor">#</a> Research skills:</h3> <p>By the end of the first year, you should be familiar with the basic research process.  By the end of the second year, you should achieve moderate independence for developing a technical approach and develop some ability to identify potentially interesting research directions.  By the end of the third year, you should be able to contribute substantially to the direction of research and carry out projects with a high degree of independence.  By the fourth year, you should be able to propose and evaluate research ideas.  By the fifth year, you should be able to complete a project completely independently if necessary (though advice is always good).</p> <h3 id="communication-2"><a href="#communication-2" class="header-anchor">#</a> Communication:</h3> <p>In the first year, you should learn to write a clear and well-organized research paper.  In the second year, learn to anticipate reader/reviewer concerns and to better identify motivations and areas to focus the writing. Be able to write a background section that explains the contribution.  By the third year, you should be able to contribute to the introduction and motivation and be more comfortable framing a paper.  After that, you should be able to write a paper independently if necessary, though back-and-forth often improves the document.</p> <h2 id="other-related-articles"><a href="#other-related-articles" class="header-anchor">#</a> Other related articles</h2> <ol><li>Mike Shou, <a href="https://zhuanlan.zhihu.com/p/338193330" target="_blank" rel="noopener noreferrer">哥大读博五年总结<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</s
