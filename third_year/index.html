5dO4xkDWbEpossJPLSrPjYID8rS2UHTlvyNxqIGsg674XJJ7vnh5L7PNwC4hh2sjCI96mzszOTpxLF0T7l88Yz7lAuK6OnL8gXLOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">博三小结<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>年更博主回来了！由于过去半年生活起伏不断，这篇更新也就姗姗来迟了。感谢一直关注的朋友们，偶尔还能收到你们的鼓励和问候邮件，很开心这个系列有人喜欢，会继续写下去的，只是更新频率嘛……可能会不太稳定（笑）。如果用一句话总结这一年的话，那就是：我开始接受一切的发生，并对一切心怀感激。</p> <p>博三这一年，对我来说是一次彻底的认知重塑。之前总是过于天真，觉得自己就是幸运儿，我想要的东西总能得到。但读到第三年，慢慢意识到，不一定要得到才能算是幸运呀，人生不过是一场经历，能够拥有追逐并为之努力的机会，何尝不是一种幸运呢。如果做一件事情，只能接受快乐，圆满的结局，而不能接受可能的失落和痛苦，那只能一辈子活在幻梦中才能不受伤害吧。</p> <p>而我，的确曾经深陷在自我编织的幻梦中。刻意忽视与预期不符的信号，用一种近乎执拗的姿态在错误的路上一路狂奔。当然最后撞的头破血流。因为太过于相信，当结局与信念相反的时候，带来冲击也会异常剧烈。这种把自己整个打碎再进行重组的过程是痛苦的，这相当于告诉一个加了思想钢印的人，他奉为人生圭臬的信条，只是一个一厢情愿的笑话。可是不打碎是没办法获得新生的，不能由于害怕动手术，就放任腐坏的组织继续蔓延。断尾求生，虽不如一帆风顺那么体面，但总好过坐以待毙。</p> <p>去年九月的时候，那个做了一年的项目被拒了。说到底还是出发点不够好呀，所以无论花多少精力，都挖不出真正有价值的东西，是个没什么意思的项目。承认这一点其实挺难的，毕竟此前我一直是相信，努力就会有回报。但现在我再审视这一个观点的话，会觉得这句话是没错，却忽略了一个很重要的前提：<strong>在正确的道路上</strong>，努力就会有回报。立意的高度，早已决定了一个项目的上限和下限。这可能也是为什么老板一直希望我去做新的项目吧。与其把时间耗在一个没有前景的方向上，不如早点启程，去做真正值得投入的事。</p> <p>以前我很崇拜那种“死磕到底”的人，哪怕孤身一人也要硬把冷门项目做出来。但现在明白了，放弃并不丢人，学会及时止损才是更重要的一课。把时间和精力留给值得的事情，本身就是一种成熟的生活态度。从某种意义上说，那个项目被拒，反而成了我成长的分水岭。真正的勇气，是敢于承认“这条路走错了”，并有力气重新开始。</p> <p>所以啊，即便没有等来“龙傲天”式的爽文剧情，我也觉得这样挺好。一切都是最好的安排。戳破幻梦，才算迈出了通往未来的第一步。</p> <p>欢迎来到现实世界，祝我玩得尽兴！</p></div></div> <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.css" integrity="sha384-AfEj0r4/OFrOo5t7NnNe46zW/tFgW6x/bCJG8FqQCEo3+Aro6EYUG4+cU+KJWu/X" crossorigin="anonymous"> <script defer="defer" src="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.
