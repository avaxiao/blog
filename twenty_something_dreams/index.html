O2pZ7B5dO4xkDWbEpossJPLSrPjYID8rS2UHTlvyNxqIGsg674XJJ7vnh5L7PNwC4hh2sjCI96mzszOTpxLF0T7l88Yz7lAuK6OnL8gXLOnTvpzSb22YG8W7us3jSebFHeeqnXRG1vt+MoUM84LQIBmMsCTAcOauTh0T0l0neQK7m2bLMt2mGxU3HYssS0J2cdv5wljlPsrIuZLAG/2DOZIXgCYT8uMGZN+e2kSirfxZOPCsC0f24nTZzspnVn9VePS1Z5vubmAGGXG8ZFno9Hel0yfA5ZPhF7Dh972BQJ2qCpgH67lmWtBYbvk6sz02wjky2vXyz0XErP/kFB619js1BtwfOV4OPRqOQBjy3Qbk18vigUPPSD5ceHnwck7W9bhAqZdd7SuG7w4/P2F/GaJh8c7e9qgow+Q7cGBo+98WsLkuktFqiZabtXuQTu/Y5ETbR0v7tNSFnvrmu6pjdoan2KjMu8q/Hmj1EfCO2ZGfEIbIXKUlw8qaX9/b2oeSJmFksSeT/Fn0V3nSypChh4Gjh74ybO9aeZ/AN2dwciu2/MhAAAAAElFTkSuQmCC">理想三旬<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>昨晚梦见一场大雨，水淹了街道，四处爆炸。我被炸伤了腹部，却还是蹒跚着往小时候的家走，哪怕我并不知道那个家里有谁。快到家的时候，我看见一个年轻女人，打扮精致，神情恬静地站在楼道前。这个画面很奇怪，她与这个混乱的时空格格不入。但我已经没有力气再多看她一眼。</p> <p>我脑子里只有一个念头：现在还不可以结束。我还有很多事情没有做完。</p> <p>我几乎是被这个念头惊醒的。醒来以后，房间里很安静。我躺在那里，却久久没有办法重新睡去，那种逼近终点的感觉还残留在脑海里。我忽然很清楚地意识到，我还不想死。如果此时此刻，我的生命戛然而止，那我这一生未免太过没有分量了。我害怕，这绝不该是我的剧本。</p> <p>年少的时候，总觉得“未来”这个词太过飘渺，没有实感。我不知道我会在哪里，我也不希望我的未来是可预见的。因为没有真正见识过生活，所以有种近乎烂漫的理想主义，总觉得人生应该很辽阔。</p> <p>后来真的走出去，见过了一些事，也经历了一些反复。做过选择，也推翻过自己的选择；得到过一些东西，也失去过一些东西。直到站在二十多岁的尾巴，我才逐渐想明白，自己究竟想要怎样的人生。如果说之前那么多年是体验，是冒险，是不断推倒重来；那么从今往后，我想开始建造。我想一砖一瓦地搭建起我的理想境域。</p> <blockquote><p>我想拥有选择的自由，也拥有承担后果的能力。</p> <p>我要做自己感到有意义的事情，去任何我想去的地方。</p> <p>我希望很多年以后，不会觉得自己曾经因为懒惰、怯懦或者犹疑，而放弃了那些真正重要的东西。</p></blockquote> <p>这当然很难，我已经不像年少时那么天真，觉得世事会乖乖按照我脑海中的排演上演。我知道有些事物无法两全，有些自由需要能力支撑，有些选择一旦做出，带来的后果可能难以承受。只要和这个世界交手，痛苦在所难免。</p> <p>人生大概就是一场盛大的探险。会遇见大雨，会受伤，会走很多没有答案的路，也会有很多时候，根本不知道前面等待你的是什么。可我还是想继续往前走。</p> <p>所以那个梦醒来后，我做了一个很孩子气的决定。</p> <p><strong>我决定，我要活很久。我的人生，永无定数。</strong></p></div></div> <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.css" integrity="sha384-AfEj0r4/OFrOo5t7NnNe46zW/tFgW6x/bCJG8FqQCEo3+Aro6EYUG4+cU+KJWu/X" crossorigin="anonymous"> <script defer="defer" src="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.js" integrity="sha384-g7c+Jr9ZivxKLnZTDUhnkOnsh30B4H0rpLUpJ4jAIKs4fnJI+sEnkvrMWph2EDg4" crossorigin="anonymous"></script> <script defer="defer" src="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/contrib/auto-render.min.js" integrity="sha384-mll67QQFJfxn0IYznZYonOWZ644AWYC+Pt2cHqMaRhXVrursRwvLnLaebdGIlYNa" crossorigin="anonymous"></script> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/blog/tags/?tag=prose" title="标签">#prose</a></div> <div class="last-updated"><span class="prefix">Update Time:</span> <span class="time">2026/09/18, 12:57:19</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/blog/PhD_summarization_list/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">PhD Guideline</div></a> <!----></div> <div class="page-nav"><p class="inner"><span class="prev">
