            博四小结
            <!----></a></h2> <div class="article-info"><span title="author" class="iconfont icon-touxiang">Ava</span> <span title="create time" class="iconfont icon-riqi">2026-05-10</span> <span title="category" class="iconfont icon-wenjian"><a href="/blog/categories/?category=PhD%20Journey">PhD Journey</a></span> <span title="tag" class="iconfont icon-biaoqian tags"><a href="/blog/tags/?tag=reflection">reflection</a></span></div></div> <div class="excerpt-wrapper"><div class="excerpt"><p>读博的日子真的过得很快，四年的光阴不过弹指一挥间。周围认识的人相继毕业，我已经成了UIUC名副其实的老登。香槟这个地方呆久了，会恍惚自己进入了一个结界，结界里的活动只有research，每天两点一线，家--siebel 或者 siebel--家。emo的情绪就像潮水，每天潮起潮落，连绵不绝。但好在潮水上不了岸，也不会彻底冲垮精神世界。</p>
</div> <a href="/blog/fourth_year/" class="readmore iconfont icon-jiantou-you">Read More</a></div></div><div class="post card-box"><div class="title-wrapper"><h2><a href="/blog/third_year/">
            博三小结
            <!----></a></h2> <div class="article-info"><span title="author" class="iconfont icon-touxiang">Ava</span> <span title="create time" class="iconfont icon-riqi">2025-05-17</span> <span title="category" class="iconfont icon-wenjian"><a href="/blog/categories/?category=PhD%20Journey">PhD Journey</a></span> <span title="tag" class="iconfont icon-biaoqian tags"><a href="/blog/tags/?tag=reflection">reflection</a></span></div></div> <div class="excerpt-wrapper"><div class="excerpt"><p>年更博主回来了！由于过去半年生活起伏不断，这篇更新也就姗姗来迟了。感谢一直关注的朋友们，偶尔还能收到你们的鼓励和问候邮件，很开心这个系列有人喜欢，会继续写下去的，只是更新频率嘛……可能会不太稳定（笑）。如果用一句话总结这一年的话，那就是：我开始接受一切的发生，并对一切心怀感激。</p>
</div> <a href="/blog/third_year/" class="readmore iconfont icon-jiantou-you">Read More</a></div></div><div class="post card-box"><div class="title-wrapper"><h2><a href="/blog/second_year/">
            博二小结
            <!----></a></h2> <div class="article-info"><span title="author" class="iconfont icon-touxiang">Ava</span> <span title="create time" class="iconfont icon-riqi">2023-11-25</span> <span title="category" class="iconfont icon-wenjian"><a href="/blog/categories/?category=PhD%20Journey">PhD Journey</a></span> <span title="tag" class="iconfont icon-biaoqian tags"><a href="/blog/tags/?tag=reflection">reflection</a></span></div></div> <div class="excerpt-wrapper"><div class="excerpt"><p>时间一晃来到了博二，依旧是没有paper的一年。虽然很多人都和我说paper不能证明什么，但没有paper，一定说明哪里出了问题，更别说我的研究方向是CV了。痛苦自责的情绪在暑期实习之后到达顶峰，开始质疑自己各方面的能力，觉得自己辜负了Derek也辜负了暑期实习的mentor，他们给了我绝对的研究自由，我却什么也没搞出来。我开始害怕和人交流，不想见人不想说话，觉得自己就是个完完全全的失败者。</p>
</div> <a href="/blog/second_year/" class="readmore iconfont icon-jiantou-you">Read More</a></div></div><div class="post card-box"><div class="title-wrapper"><h2><a href="/blog/PhD_summarization_list/">

<h2 id="goals-of-a-phd"><a class="header-anchor" href="#goals-of-a-phd">#</a> Goals of a PhD</h2>
<p>Most students begin the PhD with very little advanced research experience but with some project experience and possibly involvement in a research lab.  During the PhD, a student in computer vision must become familiar with a broad range of techniques and maths.  The student should also have a very good understanding of the background of 2-3 areas and contribute towards 1-3 areas in the dissertation and other published works.  Progressing towards the PhD requires developing in several areas:</p>
</div> <a href="/blog/PhD_summarization_list/" class="readmore iconfont icon-jiantou-you">Read More</a></div></div><div class="post card-box"><div class="title-wrapper"><h2><a href="/blog/2022_Fall_CS_PhD_application/">
            2022 Fall CS PhD申请总结
            <!----></a></h2> <div class="article-info"><span title="author" class="iconfont icon-touxiang">Ava</span> <span title="create time" class="iconfont icon-riqi">2022-01-21</span> <span title="category" class="iconfont icon-wenjian"><a href="/blog/categories/?category=PhD%20Journey">PhD Journey</a></span> <span title="tag" class="iconfont icon-biaoqian tags"><a href="/blog/tags/?tag=resource">resource</a></span></div></div> <div class="excerpt-wrapper"><div class="excerpt"><h2 id="碎碎念"><a class="header-anchor" href="#碎碎念">#</a> 碎碎念</h2>
<p>选择读博算是人生中数一数二的重大决定了，这条路很难，尤其是现在CV领域竞争白热化，很多次想过放弃，但万幸遇到了很多良师益友，最终一步步走了过来。在此做个记录，希望能给之后打算申请PhD的同学一些帮助。</p>
