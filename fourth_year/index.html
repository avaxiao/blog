y0luO4aMhtkLL8Bi3bUWYvzh5Mn1dTxrL6QmGuRhGL/TiTTxRoEdTszSaq9GR0NGA3KdkOz3hqSV3MIDhQ5IVX/Ivx3umBti2es2h4eZby7x8br1rkf7Mo90AqC8aQ3sJeNzqFRu+vSANAQe3PL7l0HGOAdwDCeZYvNKeoZp1Qfs6Aipndh86HmFRi0LAnEO47wsqM6cdfjh3jBPUzhZy7nvlUfFsamED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">博四小结<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>读博的日子真的过得很快，四年的光阴不过弹指一挥间。周围认识的人相继毕业，我已经成了UIUC名副其实的老登。香槟这个地方呆久了，会恍惚自己进入了一个结界，结界里的活动只有research，每天两点一线，家--siebel 或者 siebel--家。emo的情绪就像潮水，每天潮起潮落，连绵不绝。但好在潮水上不了岸，也不会彻底冲垮精神世界。</p> <p>老登的特点之一就是喜欢回首过去。再次翻看我入学之前看到的劝退帖，《<a href="https://movie.douban.com/review/6180006/" target="_blank" rel="noopener noreferrer">魔法少女小圆其实讲的是PhD的故事<span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></a>》，真是别有一番滋味。可能是初生牛犊不怕虎吧。这种明知山有虎，偏向虎山行的英勇精神还蛮让现在的我佩服的。我很难斗志昂扬，精神抖擞地说，再来一次还会毫不犹豫选择这条路。但我能说的是，我会在斟酌再三，反复犹疑之后，再次踏上这条布满荆棘的征程。</p> <p>读博最痛苦，挑战最大的地方不是体力上的痛苦，而是精神上的凌迟。我不想美化这条路，我也不想假装自己是天赋型选手，举重若轻。我的经历就是，我做了很多很多实验，绝大多数都是失败。不停地迭代，看不到尽头在哪里。我其实不怕累的，只是这种盲人点灯的经历很让人绝望。从去年五月开始到十一月一直在推一个项目，半年时间最后证明motivation就是错的。但这就是科研，它不会因为你花的时间多，就给你苦劳，假装错的是对的。</p> <p>这一次我很快就接受了这个结果，自悯自怜毫无意义。让我蛮感动的是，老板怕我心态爆炸，还特意在他开会的间隙来找我闲聊，估计是怕我再次陷入悲观情绪。怎么说呢，肯定是会有情绪波澜的。但失败这件事，就和练举重一样，刚开始一点重量就会将你击垮，但后面练的多了，你的肌肉在反复拉扯后，会变得越来越强大。</p> <p>失败之后，重要的如何把错误纠正，而不是抱怨为什么这件事会发生我身上。这估计也是读博最大的财富吧。读博这个选择，可以给你五年时光，没有外在压力，自由地去探索一些未知的问题。就算探索失败，最直接的代价也不过是少了一篇论文，而不是人生就此崩塌。</p> <p>想明白这一点其实就好受很多了。只要稳住自己的心态，不要在意外界的看法，后面的事都好说。把读博当作一个给你失败权利的机会。五年时间，总会做出来满意的成果的。</p> <p>产出是需要时间的。如果想要做出一个完善的工作，前期那些看起来漫长、混乱、没有结果的探索，或许本来就是必要的一部分。所以现在再看到那些“两周发一篇论文”“三天从零完成一个项目”的内容，我内心毫无波澜。如果只看最后出成果的那一刻，那我甚至也可以说，我只花了一天就申请到了 PhD。</p> <p>科研不是短视频，无法每一步都即时反馈，也很难每一次努力都立刻兑换成成果。很多时候，我们能做的只是判断一个方向还值得走，然后在漫长的不确定里继续走下去。</p> <p>如果我们能确信自己做的是正确的事，那只要继续走下去就好。同祝。</p></div></div> <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.css" integrity="sha384-AfEj0r4/OFrOo5t7NnNe46zW/tFgW6x/bCJG8FqQCEo3+Aro6EYUG4+cU+KJWu/X" crossorigin="anonymous"> <script defer="defer" src="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.js" integrity="sha384-g7c+Jr9ZivxKLnZTDUhnkOnsh30B4H0rpLUpJ4jAIKs4fnJI+sEnkvrMWph2EDg4" crossorigin="anonymous"></script> <script defer="defer" src="https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/contrib/auto-render.min.js" integrity="sha384-mll67QQFJfxn0IYznZYonOWZ644AWYC+Pt2cHqMaRhXVrursRwvLnLaebdGIlYNa" crossorigin="anonymous"></script> <!----> <div class="page-edit"><!----> <div class="tags"><a href="/blog/tags/?tag=reflection" title="标签">#reflection</a></div> <div class="last-updated"><span class="prefix">Update Time:</span> <span class="time">2026/07/05, 16:16:01</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/blog/third_year/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">博三小结</div></a> <a href="/blog/PhD_summarization_list/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">PhD Guideline</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
